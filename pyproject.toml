[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "fibsem"
version = "0.5.2.dev0"

description = "a universal api for fibsem control"
authors = [{ name = "Patrick Cleeve", email = "patrick@openfibsem.org" }]
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT License" }
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: napari",
]

dependencies = [
    "tifffile>=2021.7.2",
    "numpy>=1.23.5,<2.0.0; python_version < '3.9'",
    "numpy>=2.0.0; python_version >= '3.9'",
    "scipy>=1.10.0",
    "opencv-python-headless>=4.7.0.72",
    "scikit-image>=0.19.3",
    "matplotlib>=3.7.0",
    "matplotlib_scalebar>=0.8.1",
    "petname>=2.6",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "psygnal",
    "ome_types",
    # lxml 6.1.2 (2026-08-19) shipped no cp38 wheel for Windows, so pip falls back to
    # building from source and the runner has no libxml2 headers -- every Windows 3.8
    # job fails at install, on any commit. Capped for 3.8 alone; everything newer stays
    # on the current release.
    "lxml[html_clean]; python_version >= '3.9'",
    "lxml[html_clean]<6.1.2; python_version < '3.9'",
    "importlib_metadata>=4.6; python_version < '3.10'",
]

[project.urls]
Homepage = "https://github.com/fibsem-os/fibsem-os"
"Bug Tracker" = "https://github.com/fibsem-os/fibsem-os/issues"

[project.optional-dependencies]
ml = [
    "tqdm>=4.65.0",
    "zarr>=2.13.6",
    "dask>=2023.3.0",
    "torch>=2.0.0,<=2.3.0",
    "torchvision>=0.15.1",
    "segmentation-models-pytorch>=0.3.2",
    "plotly>=5.14.1",
    "kaleido==0.2.0",
    "transformers>=4.36.2",
]
ui = [
    "napari>=0.4.17; python_version < '3.9'",         # Python 3.8 support stops after 0.4.19
    "napari>=0.5.1,<=0.5.6; python_version >= '3.9'", # NumPy 2 well supported from 0.5.1
    "pyqt5>=5.15.9",
    "pyqt5-qt5 == 5.15.2 ; platform_system == 'Windows'",
    "qtawesome>=1.4.0", # bundled Material Design Icons font (offline icon rendering); >=1.4.0 guards Spin.start/stop before first paint
]
odemis = ["pylibtiff", "shapely"]

reporting = [
    "reportlab<3.6.13; python_version < '3.9'",
    "reportlab>=3.6.13; python_version >= '3.9'",
]

server = ["fastapi>=0.100.0", "uvicorn[standard]>=0.20.0", "requests>=2.28.0"]

# Test tooling. Install with `pip install .[test]` (CI does this).
test = [
    "pytest>=7.2.2",
    "pytest-xdist>=3.0",   # parallel execution (-n auto --dist worksteal)
    "pytest-timeout>=2.1", # fail a hung test instead of blocking the whole run
]

# Lint tooling. Install with `pip install .[dev]`.
# Pinned rather than floored: a new ruff release can add a rule or change a fix
# and turn CI red on a commit that changed nothing. Keep the pin in sync with
# the lint job in .github/workflows/python-package.yml.
dev = ["ruff==0.16.3"]

[project.scripts]
fibsem_ui = "fibsem.ui.FibsemUI:main"
fibsem_label = "fibsem.ui.FibsemLabellingUI:main"
fibsem-generate-config = "fibsem.configuration:gen_config_cli"
fibsem-config-ui = "fibsem.ui.widgets.microscope_config_widget:main"
fibsem-autolamella-ui = "fibsem.applications.autolamella.ui.AutoLamellaMainUI:run_ui"
fm-image-viewer-ui = "fibsem.ui.fm.widgets.fm_image_viewer_widget:main"
fibsem-correlation-ui = "fibsem.ui.correlation.widgets.correlation_tab_widget:main"
fibsem-cli = "fibsem.cli:main"

# Recursive by design. A bare `packages = ["fibsem"]` is NOT recursive: it ships
# only the top-level fibsem/*.py and none of fibsem/ui, fibsem/milling, etc. That
# it worked at all was an accident of setuptools_scm (in build-requires above)
# registering a file finder that swept in every git-tracked file — so package
# discovery silently depended on a build tool with no config section of its own.
# See FIB-373.
[tool.setuptools.packages.find]
include = ["fibsem*"]
# Stated explicitly because it is load-bearing, not a preference: a dozen
# directories are PEP 420 namespace packages with no __init__.py, including
# fibsem/ui/widgets (68 modules), fibsem/microscopes and fibsem/ui/napari.
# This defaults to true for pyproject config, but setting it false — or reaching
# for find_packages semantics — would silently drop all of them from the wheel.
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: tests dominated by simulated-hardware timing (deselect with -m 'not slow')",
    "hardware_sim: drives the Demo microscope simulator end-to-end",
    "ui: requires the [ui] extra (napari/pyqt5); auto-skipped when absent",
    "integration: exercises multiple components together",
]
# Treat warnings as errors so new deprecations fail fast. Add targeted `ignore`
# entries here for third-party warnings we can't fix at the source.
filterwarnings = [
    "error",
    # pyparsing (pulled in by matplotlib) still calls several of its own
    # renamed-and-deprecated methods (oneOf, parseString, ...) at import time on
    # some Python versions' dependency resolutions — third-party, not ours to fix.
    # Match pyparsing's "'<name>' deprecated - use ..." message family + the
    # built-in DeprecationWarning category. Do NOT reference pyparsing's own
    # warning class: it isn't importable on every version and breaks the filter
    # at startup.
    "ignore:'[^']*' deprecated - use:DeprecationWarning",
]

[tool.ruff]
# target-version is deliberately unset: ruff reads requires-python above and
# infers py38, so the two can never drift apart.
extend-exclude = [
    "external",
    # Vendored upstream: pyto, by Vladan Lucic (MPI of Biochemistry). Linting or
    # formatting it would make it undiffable against upstream, and its findings
    # are not ours to fix -- points.py:59 has a live `unitx`/`units` typo that
    # belongs upstream, not in a local patch. Excluding it drops 14 F401, 17
    # E701, 11 F841 and 6 F821 that no one here was ever going to action.
    "fibsem/correlation/pyto",
    # Ruff rewrites notebooks in place, re-sorting imports inside the cell JSON.
    # Whether the notebooks are in scope is a separate question to this config.
    "**/*.ipynb",
]

[tool.ruff.format]
# Ruff formats Python inside fenced code blocks in Markdown. Documentation
# snippets are written to be read, not to satisfy a line-length rule: it wanted
# to wrap a three-argument call in README.md across three lines, and to rewrite
# 84 lines of docs/design/autofocus.md. Whether the docs get formatted is its
# own decision, and not one a formatter should make on the way past.
exclude = ["**/*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# E501 (line-length) is deliberately absent. A formatter is what wraps code, and
# most of the ~5.6k current hits are long strings and comments nothing can wrap.
#
# RUF100 (unused-noqa) is absent for a sharper reason: it is relative to `select`,
# so with a narrow rule set it deletes the suppressions for every rule that is
# not enabled *yet*. Enabling it here would have stripped 133 `# noqa` comments,
# 95 of them `E402` -- a rule ignored two lines below, so each one would have to
# be typed back in when E402 is burned down -- plus 8 `N802` Qt-override
# suppressions for a rule this repo has never run, and the rationale comments
# attached to them ("kept alive for app lifetime"). It belongs at the end of the
# ratchet, once `select` has stopped moving.

# Every rule below is a real violation with a real fix, parked so the linter can
# be enforced from day one instead of after a 694-violation cleanup. Burn them
# down one rule per PR and delete the line; the counts are as of this commit.
ignore = [
    "F401", # 395  unused-import -- read the warning below before touching these
    "E402", # 66   module-import-not-at-top-of-file
    "F841", # 61   unused-variable
    "E702", # 60   multiple-statements-on-one-line-semicolon
    "F821", # 24   undefined-name -- includes at least one real NameError
    "E701", # 19   multiple-statements-on-one-line-colon
    "E741", # 15   ambiguous-variable-name
    "E712", # 14   true-false-comparison
    "E721", # 12   type-comparison
    "F811", # 8    redefined-while-unused
    "F403", # 5    undefined-local-with-import-star
    "F405", # 5    undefined-local-with-import-star-usage
    "E722", # 3    bare-except
    "E731", # 3    lambda-assignment
    "F402", # 3    import-shadowed-by-loop-var
    "F601", # 1    multi-value-repeated-key-literal
]

# F401 is not a mechanical fix in this codebase, and `--fix` alone is enough to
# break it -- ruff classes most of these removals as SAFE. A dozen modules exist
# only to re-export under a shorter name, and ruff honours a redundant `X as X`
# alias as an explicit re-export but not a renaming one, so every
# `AUTOLAMELLA_EXPERIMENT_NAME as EXPERIMENT_NAME` reads as unused. Running the
# fix empties fibsem/applications/autolamella/config.py to nothing and takes
# `import fibsem.applications.autolamella.structures` down with it. Giving those
# modules an explicit __all__ is the prerequisite, and it is its own piece of work.
