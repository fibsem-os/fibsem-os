[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "fibsem"
version = "0.6.0.dev0"

description = "a universal api for fibsem control"
authors = [{ name = "Patrick Cleeve", email = "patrick@openfibsem.org" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT License" }
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: napari",
]

dependencies = [
    "tifffile>=2021.7.2",
    "numpy>=2.0.0",
    "scipy>=1.10.0",
    "opencv-python-headless>=4.7.0.72",
    "scikit-image>=0.19.3",
    "matplotlib>=3.7.0",
    "matplotlib_scalebar>=0.8.1",
    "petname>=2.6",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "psygnal",
    "ome_types",
    # Imported directly in 16 modules (server context, labelling, FM viewers). Present
    # via matplotlib all along, but a dependency we import ourselves gets named.
    "pillow>=9.0",
    "lxml[html_clean]",
    # tifffile hands every TIFF codec but zlib to imagecodecs, and nothing else here
    # pulled it in: without it an LZW-compressed file cannot be opened at all. The
    # fluorescence images people bring from other microscopes are exactly that -- a
    # Zeiss ZEN export and a METEOR ImageJ stack are both LZW.
    "imagecodecs",
    # fibsem.codec, which saves and loads the structures. Present via ome_types all
    # along; 2.12 is the first that refuses unknown keys per call (`extra=`).
    "pydantic>=2.12",
    # experiment_read_file reads a PDF the operator attaches as its text. Pure Python.
    "pypdf>=4.0",
    # The App Server's one transport (fibsem.client): the client, the MCP
    # sidecar and fibsem-mcp watch.
    "httpx>=0.27.0",
    # The App Server, the Device Server and the gateway, and the clients' event
    # streams and live frames. Plain uvicorn: its [standard] extras are speedups the
    # host does not need.
    "fastapi>=0.121.0",
    "uvicorn>=0.35.0",
    "websockets>=15.0",
    # fibsem.extras reads which extras are installed from the package metadata.
    "packaging",
]

[project.urls]
Homepage = "https://github.com/fibsem-os/fibsem-os"
"Bug Tracker" = "https://github.com/fibsem-os/fibsem-os/issues"

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "segmentation-models-pytorch>=0.3.2",
    "transformers>=4.36.2",
    # The ONNX backend, for an .onnx checkpoint.
    "onnx",
    "onnxruntime",
]
# The application UI. napari is not here: the main window imports none of it, and it
# costs ~100 packages and 116 MB. It lives in [labelling] below, for the two widgets
# that draw with it.
ui = [
    "pyqt5>=5.15.9",
    # `ensure_main_thread`, used across the widgets.
    "superqt>=0.6.0",
    "pyqt5-qt5 == 5.15.2 ; platform_system == 'Windows'",
    "qtawesome>=1.4.0", # bundled Material Design Icons font (offline icon rendering); >=1.4.0 guards Spin.start/stop before first paint
]
odemis = ["pylibtiff", "shapely"]

# Image labelling and model-assisted segmentation (`fibsem_label`,
# FibsemLabellingUI, FibsemSegmentationModelWidget) -- the one part of the tree
# that draws in napari. Pulls in [ui] for Qt and [ml] for the models, since the
# labelling UI imports torch at module level.
labelling = [
    "fibsem[ui,ml]",
    "napari>=0.5.1,<0.10", # NumPy 2 well supported from 0.5.1; 0.6+ has Python 3.13 wheels (vispy>=0.15)
]

# Empty: the server is in the base install. Kept so `pip install fibsem[server]` works.
server = []

# The MCP sidecar (fibsem-mcp). The fibsem package itself never imports mcp.
mcp = [
    "mcp>=2,<3",
]

# The headless agent (fibsem-agent): the Claude Agent SDK, which bundles the
# Claude Code CLI, running the sidecar above. Nothing else imports it.
agent = [
    "fibsem[mcp]",
    "claude-agent-sdk>=0.2.168",
]

# Everything a development machine runs except the METEOR's odemis packages.
all = ["fibsem[labelling,agent]"]

# Test tooling. Install with `pip install .[test]` (CI does this).
test = [
    "pytest>=7.2.2",
    "pytest-xdist>=3.0",   # parallel execution (-n auto --dist worksteal)
    "pytest-timeout>=2.1", # fail a hung test instead of blocking the whole run
    "jsonschema>=4",       # checks encoded structures against their JSON schema
    "httpx2",              # starlette's TestClient, which warns when it falls back to httpx
]

# Lint tooling. Install with `pip install .[dev]`.
# Pinned rather than floored: a new ruff release can add a rule or change a fix
# and turn CI red on a commit that changed nothing. Keep the pin in sync with
# the lint job in .github/workflows/python-package.yml.
dev = ["ruff==0.16.3"]

[project.scripts]
fibsem_ui = "fibsem.tools.desktop_launch:fibsem_ui"
fibsem_label = "fibsem.ui.FibsemLabellingUI:main"
fibsem-autolamella-ui = "fibsem.tools.desktop_launch:autolamella"
fm-image-viewer-ui = "fibsem.ui.fm.widgets.fm_image_viewer_widget:main"
fibsem-correlation-ui = "fibsem.ui.correlation.widgets.correlation_tab_widget:main"
fibsem-cli = "fibsem.cli:main"
fibsem-mcp = "fibsem.ai.agent.mcp.sidecar:main"
fibsem-volume = "fibsem.applications.volume.launch:main"
fibsem-volume-ui = "fibsem.tools.desktop_launch:volume"
fibsem-autolamella-server = "fibsem.applications.autolamella.launch:main"
fibsem-agent = "fibsem.ai.agent.harness:main"
fibsem-gateway = "fibsem.gateway.main:main"
fibsem-autolamella-agent = "fibsem.gateway.launch:autolamella"

# Recursive by design. A bare `packages = ["fibsem"]` is NOT recursive: it ships
# only the top-level fibsem/*.py and none of fibsem/ui, fibsem/milling, etc.
[tool.setuptools.packages.find]
include = ["fibsem*"]
# Stated explicitly because it is load-bearing, not a preference: a dozen
# directories are PEP 420 namespace packages with no __init__.py, including
# fibsem/ui/widgets (68 modules).
# This defaults to true for pyproject config, but setting it false — or reaching
# for find_packages semantics — would silently drop all of them from the wheel.
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.yaml"]
"fibsem.server" = ["ui/*.html", "ui/assets/*"]
"fibsem.correlation" = ["data/zeta_lut.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# napari ([labelling]) and npe2 register pytest plugins that import napari, which
# warns under pydantic 2 at import and so fails collection under "error" below. No
# test uses their fixtures.
addopts = "-ra --strict-markers --strict-config -p no:napari -p no:npe2"
markers = [
    "slow: tests dominated by simulated-hardware timing (deselect with -m 'not slow')",
    "hardware_sim: drives the Demo microscope simulator end-to-end",
    "ui: requires the [ui] extra (pyqt5); auto-skipped when absent",
    "integration: exercises multiple components together",
]
# Treat warnings as errors so new deprecations fail fast. Add targeted `ignore`
# entries here for third-party warnings we can't fix at the source.
filterwarnings = [
    "error",
    # pyparsing (pulled in by matplotlib) still calls several of its own
    # renamed-and-deprecated methods (oneOf, parseString, ...) at import time on
    # some Python versions' dependency resolutions — third-party, not ours to fix.
    # Match pyparsing's "'<name>' deprecated - use ..." message family + the
    # built-in DeprecationWarning category. Do NOT reference pyparsing's own
    # warning class: it isn't importable on every version and breaks the filter
    # at startup.
    "ignore:'[^']*' deprecated - use:DeprecationWarning",
    # The same family under its other wording, "'<arg>' argument is deprecated, use
    # '<new_arg>'": matplotlib's mathtext parser passes pyparsing a renamed keyword
    # (endQuoteChar) on the 3.9 build's resolution. Raised the first time anything
    # lays out mathtext in a process -- a scalebar's label is enough.
    "ignore:'[^']*' argument is deprecated, use:DeprecationWarning",
    # anyio 4.15 deprecated the anyio.abc.BlockingPortal alias; starlette's
    # TestClient (through 1.6.0) still imports it, at import time - third-party.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
# target-version is deliberately unset: ruff reads requires-python above and
# infers py310, so the two can never drift apart.
extend-exclude = [
    "external",
    # Ruff rewrites notebooks in place, re-sorting imports inside the cell JSON.
    # Whether the notebooks are in scope is a separate question to this config.
    "**/*.ipynb",
]

[tool.ruff.format]
# Ruff formats Python inside fenced code blocks in Markdown. Documentation
# snippets are written to be read, not to satisfy a line-length rule: it wanted
# to wrap a three-argument call in README.md across three lines, and to rewrite
# 84 lines of a design document. Whether the docs get formatted is its
# own decision, and not one a formatter should make on the way past.
exclude = ["**/*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
# E501 (line-length) is deliberately absent. A formatter is what wraps code, and
# most hits are long strings and comments nothing can wrap.
#
# RUF100 (unused-noqa) is absent because it is relative to `select`: with a narrow
# rule set it deletes the suppressions for every rule that is not enabled *yet*
# (E402, ignored below, and N802 Qt overrides among them). It belongs at the end of
# the ratchet, once `select` has stopped moving.

# Rules that are switched off because the codebase does not satisfy them yet --
# not because they are wrong. Each is a real violation with a real fix. Burn one
# down per pull request and delete its line.
#
# Deliberately no counts here. They change with every merge, so a number written
# in this file is wrong within days, and it is the copy people trust because it
# sits next to the config. Current numbers are one command:
#
#     ruff check --select E402 --statistics .     # or ALL, or any rule below
#
# and the burn-down is tracked in Linear under FIB-754, which is also where the
# per-rule analysis lives.
#
# What is worth writing down here is what does NOT drift:
ignore = [
    # F821 (undefined-name) is NOT here, deliberately. It was, with a note saying
    # every remaining instance was dead or annotation-only and none was a live
    # NameError. Three live ones shipped while it was off: a removed colour
    # constant still referenced by the interpolate dialog, a style token used
    # before its import, and a bitmap pattern converter reaching for a constant
    # that stayed behind in the module it was split out of (FIB-1027). A lint
    # that cannot see an undefined name does not catch the bug it exists for.
    "E402",
    "F841",
    "E702",
    "E701",
    "E741",
    "E712",
    "E721",
    "F811",
    "F403",
    "F405",
    # Swallows KeyboardInterrupt and SystemExit along with everything else. On a
    # long acquisition that is the difference between Ctrl+C working and not.
    "E722",
    "E731",
    "F402",
    "F601",
    # pyupgrade's annotation rules are off on purpose, unlike everything above:
    # they are not waiting to be burned down. The old spellings run exactly the
    # same, and converting thousands of them across most of the tree is churn with
    # no behaviour behind it. Either spelling is fine in new code. Every other UP
    # rule is enforced.
    "UP045",  # Optional[X] -> X | None
    "UP006",  # List[X] -> list[X]
    "UP035",  # deprecated typing imports
    "UP037",  # quoted annotations
    "UP007",  # Union[X, Y] -> X | Y
]

# F401 (unused-import) is on. Ruff answers "is this name used in this file", not
# "is it safe to delete": a name another module reaches as `mod.X`, or patches by
# its dotted path, looks unused to it. A package's re-exports go in its
# `__all__` (or `import X as X`). Check the whole repo before deleting one, and
# run the suite.

[tool.ruff.lint.per-file-ignores]
# The AutoScript SDK names this driver imports in its availability check are its
# namespace: services.py, images.py and the parity fixtures reach them as
# `autoscript.X`.
"fibsem/drivers/autoscript/microscope.py" = ["F401"]
# The TESCAN SDK names the driver's modules reach as `sdk.X`.
"fibsem/drivers/tescan/sdk.py" = ["F401"]
