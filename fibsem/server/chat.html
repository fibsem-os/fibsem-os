<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Chat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231e2027'/%3E%3Cpath d='M16 6v20M6 16h20' stroke='%239d78e8' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='none' stroke='%239d78e8' stroke-width='2'/%3E%3C/svg%3E">
<style>
  /* napari-dark, from fibsem/ui/tokens.py, as the event log has it. */
  :root {
    --surface:#262930; --panel:#1e2027; --row-alt:#2b2f38; --canvas:#1e2124;
    --border:#3d4251; --text:#d6d6d6; --strong:#f0f1f2; --muted:#868e93;
    --accent:#50a6ff; --primary:#007ACC; --ok:#4caf50; --warn:#e0a030;
    --err:#d04040; --agent:#9d78e8;
    --mono:ui-monospace,"SF Mono",Consolas,"Cascadia Mono",monospace;
  }
  * { box-sizing:border-box; margin:0; }
  html, body, #app { height:100%; }
  body { background:var(--surface); color:var(--text);
    font-family:system-ui,"Segoe UI",sans-serif; font-size:13px; line-height:1.5; }
  button, select, textarea { font:inherit; color:inherit; }
  .muted { color:var(--muted); }

  .page { display:flex; flex-direction:column; height:100%; max-width:820px; margin:0 auto; }

  header { display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:10px 16px; }
  header .exp { font-weight:600; color:var(--strong); }
  header .controls { margin-left:auto; display:flex; gap:8px; align-items:center; }
  select { background:var(--panel); border:1px solid var(--border); border-radius:3px;
    padding:3px 6px; font-size:12px; }
  .btn { background:var(--panel); border:1px solid var(--border); border-radius:3px;
    padding:4px 12px; font-size:12px; cursor:pointer; }
  .btn:hover { border-color:var(--muted); }
  .btn.primary { background:var(--primary); border-color:var(--primary); color:#fff; }
  /* The level and Stop agent, drawn as the window's chip draws them. */
  .chip { font:inherit; font-size:12px; font-weight:700; padding:4px 10px; border-radius:3px;
    cursor:pointer; color:var(--strong); background:transparent; border:1px solid var(--agent); }
  .chip.off { color:var(--muted); border-color:transparent; }
  .chip.assist { background:rgba(157,120,232,.35); }
  .chip.drive { background:var(--agent); }
  .chip.stop { border-color:var(--err); }
  .chip.stop:hover { background:rgba(208,64,64,.25); }
  .chip:disabled { opacity:.5; cursor:default; }
  .level-wrap { position:relative; }
  .level-menu { position:absolute; right:0; top:calc(100% + 4px); z-index:4; min-width:190px; padding:4px 0;
    background:var(--panel); border:1px solid var(--border); border-radius:3px; box-shadow:0 6px 18px rgba(0,0,0,.4); }
  .level-menu button { display:grid; grid-template-columns:18px 1fr; width:100%; text-align:left; padding:6px 12px;
    background:none; border:0; cursor:pointer; }
  .level-menu button:hover { background:var(--row-alt); }
  .level-menu .dot { color:var(--agent); }
  .level-menu b { color:var(--strong); }
  .level-menu small { grid-column:2; color:var(--muted); font-size:11.5px; }
  .session { margin:0 16px 6px; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .now { margin:0 16px 8px; font-size:12px; color:var(--strong); display:flex; gap:8px; align-items:center; }
  .now::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--agent);
    animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  .act .what { background:none; border:0; padding:0; text-align:left; color:inherit; font:inherit; cursor:pointer; }
  .act .what:hover { color:var(--strong); }
  .halves .log { margin-left:10px; color:var(--accent); text-decoration:none; }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn:focus-visible, select:focus-visible, textarea:focus-visible { outline:2px solid var(--accent); }

  /* As the card's Recent: the conversation as blocks, yours a shade lighter,
     the actions one line each, quieter between the messages. */
  .rows { flex:1; min-height:0; overflow-y:auto; margin:0 16px; background:var(--panel);
    border-radius:3px; display:flex; flex-direction:column; }
  .rows > * + .msg, .rows > * + .act { border-top:1px solid var(--border); }
  .msg { padding:8px 10px 9px; }
  .msg.you { background:var(--row-alt); }
  .msg .head { display:flex; gap:6px; font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .msg .head b { color:var(--strong); font-weight:600; }
  .msg .body { margin-top:3px; color:var(--text); overflow-wrap:anywhere; }
  .body p + p, .body p + ul, .body ul + p { margin-top:6px; }
  .body ul { padding-left:18px; }
  .body code { font-family:var(--mono); font-size:12px; background:var(--panel); padding:0 3px; border-radius:2px; }
  .evidence { margin-top:6px; position:relative; display:inline-block; max-width:100%; cursor:zoom-in; }
  .evidence img { display:block; max-width:100%; max-height:260px; }
  .evidence svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  .evidence.big { position:fixed; inset:0; z-index:5; background:rgba(15,16,19,.92);
    display:flex; align-items:center; justify-content:center; cursor:zoom-out; margin:0; }
  .evidence.big .frame { position:relative; }
  .evidence.big img { max-height:92vh; max-width:96vw; }
  .frame { position:relative; }

  .act { display:grid; grid-template-columns:40px 1fr auto; column-gap:12px; padding:6px 10px;
    font-size:12px; color:var(--text); }
  .act.quiet { padding:4px 10px; font-size:11.5px; color:var(--muted); }
  .act .when { font-size:11px; color:var(--muted); padding-top:1px; font-variant-numeric:tabular-nums; }
  .act .outcome { font-size:11px; padding-top:1px; }
  .act .why { grid-column:2 / 4; font-size:11px; color:var(--muted); }
  .act .evlink { background:none; border:0; padding:0 0 0 6px; font-size:11px; color:var(--accent); cursor:pointer; }
  .halves { display:flex; gap:6px; margin-left:12px; font-size:11.5px; color:var(--muted); }
  .halves button { background:none; border:0; border-bottom:1px solid transparent; padding:0 0 1px;
    cursor:pointer; color:var(--muted); }
  .halves button.on { color:var(--strong); font-weight:600; border-bottom-color:var(--strong); }
  .rows > .request { margin:10px; }
  .tone-ok { color:var(--ok); } .tone-error { color:var(--err); }
  .tone-waiting, .tone-running { color:var(--warn); } .tone-muted { color:var(--muted); }

  .request { border:1px solid var(--border); border-radius:3px; padding:10px 12px; background:var(--panel); }
  .request .title { font-size:11.5px; color:var(--agent); margin-bottom:4px; }
  .steps { border:1px solid var(--border); border-radius:3px; padding:8px 10px; display:flex; flex-direction:column; gap:8px; }
  .step { display:grid; grid-template-columns:16px 1fr; gap:8px; }
  .step .what { display:flex; gap:8px; font-size:11.5px; color:var(--muted); }
  .step .what .link { margin-left:auto; font-size:11.5px; }
  .step .change { color:var(--strong); }
  .details { margin-top:6px; max-height:220px; overflow:auto; background:var(--canvas); border-radius:3px; padding:6px 8px; }
  .details table { border-collapse:collapse; font-size:11.5px; }
  .details th { color:var(--muted); font-weight:400; text-align:left; padding:0 16px 2px 0; }
  .details td { padding:1px 16px 1px 0; font-variant-numeric:tabular-nums; }
  .request .reason { margin-top:6px; }
  .request .decision { margin-top:4px; color:var(--strong); }
  .request .buttons { display:flex; gap:8px; margin-top:10px; justify-content:flex-end; }
  .request input { flex:1; min-width:0; background:var(--canvas); border:1px solid var(--border);
    border-radius:3px; padding:4px 8px; color:var(--text); font:inherit; font-size:12px; }

  .empty { margin:auto; text-align:center; color:var(--muted); max-width:360px; }

  .composer { padding:12px 16px; }
  .composer textarea { width:100%; resize:none; background:var(--panel); border:1px solid var(--border);
    border-radius:3px; padding:8px 10px; min-height:38px; max-height:150px; line-height:1.4; }
  .composer .foot { display:flex; align-items:center; gap:10px; margin-top:6px; font-size:11.5px; color:var(--muted); }
  .composer .foot .btn { margin-left:auto; }
  .composer .who { font-variant-numeric:tabular-nums; }
  .composer .who b { color:var(--agent); font-weight:600; }
  .error { color:var(--err); }
  .link { background:none; border:0; padding:0; color:var(--accent); cursor:pointer; }
  .link:hover { color:#7bc0ff; }
  .connect { margin:12px 16px 0; border:1px solid var(--border); border-radius:3px; padding:10px 12px; background:var(--panel); }
  .connect .title { font-size:11.5px; font-weight:600; color:var(--strong); margin-bottom:4px; }
  .connect p { color:var(--muted); font-size:12px; }
  .connect pre { margin-top:8px; max-height:180px; overflow:auto; white-space:pre-wrap; font-family:var(--mono);
    font-size:11.5px; background:var(--canvas); border:1px solid var(--border); border-radius:3px; padding:8px; }
  .connect .buttons { display:flex; gap:8px; margin-top:10px; justify-content:flex-end; }

  .gate { max-width:420px; margin:18vh auto 0; padding:16px; }
  .gate h1 { font-size:14px; color:var(--strong); margin-bottom:8px; }
  .gate p { color:var(--muted); margin-bottom:10px; }
  .gate input { width:100%; padding:6px 8px; font-family:var(--mono); font-size:12px;
    background:var(--canvas); color:var(--text); border:1px solid var(--border); border-radius:3px; }
  .gate .btn { margin-top:8px; }
  @media (max-width:600px) {
    header .controls { margin-left:0; width:100%; }
    .row, .actions .act { grid-template-columns:38px 1fr; }
  }

  /* Files: the experiment's images, in a panel beside the chat. */
  body { display:flex; overflow:hidden; }
  #app { flex:1; min-width:0; }
  .btn.on { border-color:var(--accent); color:var(--strong); }
  #files { width:0; flex:none; overflow:hidden; background:var(--panel);
    border-left:1px solid transparent; transition:width .2s ease; }
  #files.open { width:min(520px, 46vw); border-left-color:var(--border); }
  #files .inner { width:min(520px, 46vw); height:100%; display:flex; flex-direction:column; }
  #files .bar { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--border); }
  #files .bar b { color:var(--strong); }
  #files .bar .switches { display:none; gap:4px; }
  #files .bar .switches .btn { padding:2px 8px; font-size:11px; }
  #files .bar .x { margin-left:auto; background:none; border:0; color:var(--muted); cursor:pointer; font-size:16px; padding:0 4px; }
  #files .bar .x:hover { color:var(--strong); }
  #files .split { flex:1; min-height:0; display:grid; grid-template-columns:170px 1fr; }
  .tree { overflow:auto; border-right:1px solid var(--border); padding:6px 0; }
  .tree button { display:flex; align-items:center; gap:6px; width:100%; text-align:left; background:none;
    border:0; padding:3px 10px; cursor:pointer; color:var(--text); font-size:12px; white-space:nowrap; }
  .tree button:hover { background:var(--row-alt); }
  .tree button.sel { background:rgba(80,166,255,.16); color:var(--strong); }
  .tree .name { overflow:hidden; text-overflow:ellipsis; }
  .tree .n { margin-left:auto; color:var(--muted); font-size:11px; }
  .tree .st { width:7px; height:7px; border-radius:50%; flex:none; background:var(--border); }
  .st.done { background:var(--ok); } .st.failed { background:var(--err); } .st.going { background:var(--accent); }
  .shelf { overflow:auto; padding:10px; }
  .shelf .head { display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .shelf .head b { color:var(--strong); }
  .shelf .turn { margin-left:auto; display:flex; gap:4px; }
  .pills { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:10px; }
  .pills button { background:none; border:1px solid var(--border); border-radius:10px; padding:1px 8px;
    font-size:11px; color:var(--muted); cursor:pointer; }
  .pills button.on { color:var(--strong); border-color:var(--accent); }
  .shelf .crumb { background:none; border:0; padding:0; color:var(--accent); cursor:pointer; font:inherit; }
  .shelf .group { display:block; background:none; border:0; padding:0; margin:12px 0 6px; color:var(--muted);
    font:inherit; font-size:12px; cursor:pointer; }
  .shelf .group:hover, .shelf .crumb:hover { text-decoration:underline; }
  .thumbs { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:8px; }
  .thumb { background:none; border:1px solid var(--border); border-radius:3px; padding:0; cursor:pointer;
    text-align:left; overflow:hidden; }
  .thumb:hover { border-color:var(--accent); }
  .thumb img { display:block; width:100%; aspect-ratio:3/2; object-fit:cover; background:var(--canvas); }
  .thumb .cap { padding:3px 6px; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .viewer .name { font-family:var(--mono); font-size:12px; color:var(--strong); margin-bottom:6px; word-break:break-all; }
  .viewer img { display:block; width:100%; background:var(--canvas); cursor:zoom-in; border-radius:2px; }
  .viewer dl { display:grid; grid-template-columns:auto 1fr; gap:2px 12px; margin-top:8px; font-size:12px; }
  .viewer dt { color:var(--muted); }
  .viewer .buttons { justify-content:flex-start; }
  .big-shot { position:fixed; inset:0; z-index:9; background:rgba(15,16,19,.92); display:flex;
    align-items:center; justify-content:center; cursor:zoom-out; }
  .big-shot img { max-width:96vw; max-height:92vh; }
  .evidence .infiles { position:absolute; right:6px; bottom:6px; font-size:11px; background:rgba(30,32,39,.85);
    border:1px solid var(--border); border-radius:3px; padding:1px 6px; color:var(--accent); cursor:pointer; }
  .evidence.big .infiles { display:none; }
  @media (max-width:760px) {
    #files.open { position:fixed; inset:0; width:100%; z-index:8; }
    #files .inner { width:100%; }
    #files .split { grid-template-columns:1fr; grid-template-rows:auto 1fr; }
    .tree { max-height:30vh; border-right:0; border-bottom:1px solid var(--border); }
  }

  /* The side panels' bar, down the right edge. */
  #rail { width:44px; flex:none; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding-top:8px; background:var(--panel); border-left:1px solid var(--border); }
  #rail button { width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    background:none; border:1px solid transparent; border-radius:4px; color:var(--muted); cursor:pointer; }
  #rail button:hover { color:var(--strong); background:var(--row-alt); }
  #rail button.on { color:var(--strong); border-color:var(--accent); background:rgba(80,166,255,.12); }
  #rail svg { width:18px; height:18px; }
  .panels-menu { display:none; }
  .scope { padding:12px; overflow:auto; flex:1; }
  .scope h3 { font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase;
    letter-spacing:.04em; margin:14px 0 6px; }
  .scope h3:first-child { margin-top:0; }
  .scope dl { display:grid; grid-template-columns:auto 1fr; gap:2px 12px; font-size:12px; }
  .scope dt { color:var(--muted); }
  .scope .live { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .scope .live figure { margin:0; }
  .scope .live img { display:block; width:100%; background:var(--canvas); cursor:zoom-in; border-radius:2px; }
  .scope .live figcaption { font-size:11px; color:var(--muted); margin-top:3px; }
  .scope .live .none { aspect-ratio:3/2; background:var(--canvas); display:flex; align-items:center;
    justify-content:center; color:var(--muted); font-size:12px; border-radius:2px; }
  .scope table { width:100%; border-collapse:collapse; font-size:12px; }
  .scope th { text-align:left; color:var(--muted); font-weight:400; padding:2px 8px 2px 0; }
  .scope td { padding:2px 8px 2px 0; font-variant-numeric:tabular-nums; }
  @media (max-width:760px) {
    #rail { display:none; }
    .panels-menu { display:inline-block; }
    #files .bar .switches { display:flex; margin-left:auto; }
    #files .bar .switches + .x { margin-left:0; }
    .scope .live { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div id="app"></div>
<aside id="files" aria-label="Side panel"></aside>
<nav id="rail" aria-label="Panels"></nav>
<script>
"use strict";
/* The operator's chat with the agent, over the App Server. It reads the agent
   card's rows (GET /app/agent/recent) and writes through the operator's routes,
   so the page and the card say the same thing. The operator token arrives in
   the URL fragment (never sent to the server or its logs), is kept for the
   tab's session, and stripped from the address bar. */

const $app = document.getElementById("app");
const KEY = "fibsem-operator-token";
const LIMIT = 2000;
let TOKEN = null;
let since = 0;
let state = { agent: null, rows: [] };
// Which halves of the timeline show, as the card's toggles: both at first.
const halves = { conversation: true, actions: true };
let draft = "";
const evidenceCache = new Map();
const pictureCache = new Map();
let pictureAwaited = "";
// Kept at the newest row while the operator hasn't scrolled up from it.
let pinned = true;
// Reject… asks why first, as the card does.
let rejecting = false;
// "Show details" on the request, open or not.
let detailsOpen = false;
// The level menu, open or not.
let levelOpen = false;
// A click elsewhere or Escape closes it, as a menu does.
document.addEventListener("click", e => {
  if (levelOpen && !e.target.closest(".level-wrap")) { levelOpen = false; render(); }
});
document.addEventListener("keydown", e => {
  if (levelOpen && e.key === "Escape") { levelOpen = false; render(); }
});
// "Connect an agent…": open, and its text once read ({text} or null).
let connecting = false, connectAnswer = null;

function esc(text) {
  return String(text ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

/* A small Markdown: paragraphs, "-" or "*" lists, **bold** and `code`. Escaped
   first, so nothing in a message is ever HTML. */
function markdown(text) {
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  const out = [];
  let list = null, para = [];
  const flush = () => {
    if (para.length) { out.push(`<p>${para.map(inline).join("<br>")}</p>`); para = []; }
    if (list) { out.push(`<ul>${list.map(i => `<li>${inline(i)}</li>`).join("")}</ul>`); list = null; }
  };
  for (const line of String(text ?? "").split("\n")) {
    const item = line.match(/^\s*[-*]\s+(.*)$/);
    if (item) { if (para.length) flush(); (list = list || []).push(item[1]); }
    else if (!line.trim()) flush();
    else { if (list) flush(); para.push(line); }
  }
  flush();
  return out.join("");
}

async function api(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    headers: { Authorization: `Bearer ${TOKEN}`, "Content-Type": "application/json" },
  });
  if (response.status === 401) { forget(); throw new Error("The token was refused."); }
  const body = await response.json().catch(() => ({}));
  if (!response.ok) {
    const detail = body.detail;
    throw new Error((detail && detail.message) || detail || response.statusText);
  }
  return body;
}

function forget() {
  try { sessionStorage.removeItem(KEY); } catch (e) { /* storage off */ }
  TOKEN = null;
  gate("The operator token was refused. It may have been replaced in Tools → App Server.");
}

function gate(note) {
  $app.innerHTML = `<form class="gate">
    <h1>Agent chat</h1>
    <p>${esc(note || "Open this page from the agent card's Chat link, or paste the operator token from Tools → App Server.")}</p>
    <input id="tok" type="password" placeholder="Operator token" autocomplete="off">
    <button class="btn primary" type="submit">Open</button></form>`;
  $app.querySelector("form").onsubmit = e => {
    e.preventDefault();
    const value = $app.querySelector("#tok").value.trim();
    if (value) start(value);
  };
}

function lastHeard(seconds) {
  if (seconds == null) return "not heard from yet";
  if (seconds < 60) return `last heard ${Math.round(seconds)} s ago`;
  if (seconds < 3600) return `last heard ${Math.round(seconds / 60)} min ago`;
  return `last heard ${Math.round(seconds / 3600)} h ago`;
}

function whoHtml() {
  const a = state.agent || {};
  const name = a.client ? esc(a.client.split("/")[0]) : "Agent";
  const stopped = a.stopped ? " · stopped by you" : "";
  // Until an agent is heard from, the way to connect one, as on the card.
  const connect = a.last_heard_s == null && !connecting
    ? ` · <button class="link" id="connect">Connect an agent…</button>` : "";
  return `<span class="who"><b>${name}</b> · ${lastHeard(a.last_heard_s)}${stopped}${connect}</span>`;
}

function connectHtml() {
  if (!connecting || (state.agent && state.agent.last_heard_s != null)) return "";
  const text = connectAnswer && connectAnswer.text;
  const body = connectAnswer == null ? `<p>Reading…</p>`
    : text ? `<p>Paste this into Claude Code on the microscope PC: it registers the fibsem sidecar, checks the connection and tells you its level.</p><pre id="setup">${esc(text)}</pre>`
    : `<p>fibsem-mcp isn't installed on the microscope PC. Install it there with: pip install fibsem[mcp]</p>`;
  return `<div class="connect"><div class="title">Connect an agent</div>${body}
    <div class="buttons"><button class="btn" id="connect-close">Close</button>${text ? `<button class="btn primary" id="copy-setup">Copy</button>` : ""}</div></div>`;
}

function headerHtml() {
  const a = state.agent || {};
  const level = a.level || "watch";
  const levels = a.levels || [];
  const shown = levels.find(l => l.level === level) || { word: "Agent" };
  const off = a.level == null ? " disabled" : "";
  // The menu as the card's: each level with what it allows.
  const menu = levelOpen ? `<div class="level-menu" role="menu">${levels.map(l =>
    `<button role="menuitemradio" data-level="${esc(l.level)}" aria-checked="${l.level === level}">
      <span class="dot">${l.level === level ? "●" : "○"}</span><b>${esc(l.name)}</b><small>${esc(l.tip)}</small></button>`).join("")}</div>` : "";
  const now = (a.session ? `<div class="session" title="${esc(a.session)}">${esc(a.session)}</div>` : "")
    + (a.now ? `<div class="now">${esc(a.now)}</div>` : "");
  return `<header>
    <span class="exp">${esc(a.experiment || "Agent chat")}</span>${halvesHtml()}
    <span class="controls">
      <button class="btn panels-menu" id="panels-menu" title="Panels">☰</button>
      <span class="level-wrap"><button class="chip ${esc(level)}" id="level" aria-haspopup="menu"${off}>${esc(shown.word)}</button>${menu}</span>
      <button class="chip stop" id="stop"${off}>Stop agent</button>
    </span></header>${now}`;
}

// The card's picture as the window draws it (the values on the live image),
// else *fallback*; with only a caption, the caption says why there is none.
function pictureHtml(kind, fallback) {
  const p = state.agent && state.agent.pictures && state.agent.pictures[kind];
  if (!p) return fallback;
  const caption = p.caption ? `<div class="reason muted">${esc(p.caption)}</div>` : "";
  if (!p.image) return (fallback || "") + caption;
  return `<div class="evidence" data-picture="${esc(kind)}" data-version="${p.version}"><div class="frame"></div></div>${caption}`;
}

function evidenceHtml(row) {
  const id = row.evidence && row.evidence.evidence_id;
  return id ? `<div class="evidence" data-evidence="${esc(id)}"><div class="frame"></div></div>` : "";
}

function messageHtml(row) {
  const who = { you: "You", reply: "Agent" }[row.kind] || "Agent · note";
  const body = row.kind === "you" ? `<p>${esc(row.text).replace(/\n/g, "<br>")}</p>` : markdown(row.text);
  return `<div class="msg ${row.kind}"><div class="head"><b>${who}</b><span>${esc(row.when)}</span></div>
    <div class="body">${body}</div>${evidenceHtml(row)}</div>`;
}

function actionHtml(row, quiet) {
  const why = row.why && row.tone === "error" ? `<span class="why">${esc(row.why)}</span>` : "";
  // As the card's: a click opens the event log; the word's tooltip says why
  // it ended and at which level.
  const level = row.level ? `at ${row.level[0].toUpperCase()}${row.level.slice(1)}` : "";
  const tip = [row.why ? `${row.outcome}: ${row.why}` : row.outcome, [level, row.when].filter(Boolean).join(" · ")].join("\n");
  // As the card's: the image the agent judged from, opened large.
  const id = row.evidence && row.evidence.evidence_id;
  const link = id ? ` <button class="evlink" data-open-evidence="${esc(id)}" title="Open the image the agent judged from">evidence</button>` : "";
  return `<div class="act${quiet ? " quiet" : ""}"><span class="when">${esc(row.when)}</span><span><button class="what" data-log title="Open the event log">${esc(row.text)}</button>${link}</span>
    <span class="outcome tone-${esc(row.tone)}" title="${esc(tip)}">${esc(row.outcome)}</span>${why}</div>`;
}

function halvesHtml() {
  const b = (key, word) => `<button data-half="${key}" class="${halves[key] ? "on" : ""}">${word}</button>`;
  return `<div class="halves">${b("conversation", "Conversation")}<span>·</span>${b("actions", "Actions")}<a class="log" href="${logUrl()}" target="_blank" rel="noopener">Event log</a></div>`;
}

// The event log page, with this page's token: it reads what this page reads.
function logUrl() {
  return `/dashboard/log#token=${encodeURIComponent(TOKEN || "")}`;
}

// The agent's request as the card shows it: each action a numbered step, what
// it does and the change, "Show details" for every value; while an approved
// request runs, how far each step got.
function requestHtml(request) {
  if (!request || !["pending", "applying"].includes(request.status)) return "";
  const applying = request.status === "applying";
  const actions = request.actions || [], results = request.results || [];
  const anyDetails = actions.some(a => a.details);
  const steps = actions.map((a, i) => {
    let mark = `<span class="muted">${i + 1}</span>`;
    if (applying) {
      if (i < results.length) mark = results[i].ok ? `<span class="tone-ok">✓</span>` : `<span class="tone-error">✕</span>`;
      else mark = i === results.length ? `<span>…</span>` : `<span class="muted">○</span>`;
    }
    const link = i === 0 && anyDetails ? `<button class="link" id="details">${detailsOpen ? "Hide details" : "Show details"}</button>` : "";
    return `<div class="step"><span class="mark">${mark}</span><div>
      <div class="what"><span>${esc(a.what || a.tool)}</span>${link}</div>
      ${a.change ? `<div class="change">${esc(a.change)}</div>` : ""}
      ${detailsOpen && a.details ? detailsHtml(a.details) : ""}</div></div>`;
  }).join("");
  const n = actions.length;
  const buttons = applying
    ? `<span class="muted">Approved by you. Running ${Math.min(results.length + 1, n)} of ${n}…</span>`
    : rejecting
      ? `<input id="reject-reason" placeholder="Tell the agent why (optional)"><button class="btn" id="back">Back</button><button class="btn primary" id="reject">Reject</button>`
      : `<button class="btn" id="reject-start">Reject…</button><button class="btn primary" id="approve">Approve</button>`;
  return `<div class="request" data-request="${esc(request.request_id)}">
    <div class="title">Agent asks</div><div class="steps">${steps}</div>
    <div class="reason"><span class="muted">Why:</span> ${esc(request.reason)}</div>
    ${request.evidence ? "" : `<div class="reason muted">No evidence</div>`}
    ${pictureHtml("request", request.evidence ? evidenceHtml({ evidence: { evidence_id: request.evidence } }) : "")}
    <div class="buttons">${buttons}</div></div>`;
}

function detailsHtml(details) {
  const head = (details.columns || []).map(c => `<th>${esc(c)}</th>`).join("");
  const rows = (details.rows || []).map(r => `<tr>${r.map(v => `<td>${esc(v)}</td>`).join("")}</tr>`).join("");
  return `<div class="details"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

// The agent's suggestion on a pending proposal, as the card shows it when no
// request waits: Decline… asks why first, as Reject… does.
function suggestionHtml(suggestion) {
  if (!suggestion || (state.agent && state.agent.request && state.agent.request.status === "pending")) return "";
  // As the card: "No evidence" (or why there is none) under Why.
  const none = suggestion.evidence ? "" : `<div class="reason muted">${esc(suggestion.no_evidence || "No evidence")}</div>`;
  const picture = none + pictureHtml("suggestion", suggestion.evidence ? evidenceHtml({ evidence: suggestion.evidence }) : "");
  return `<div class="request" data-suggestion="${esc(suggestion.proposal_id)}">
    <div class="title">Agent suggests</div>
    <div class="muted">${esc(suggestion.proposal)}</div>
    <div class="decision">${esc(suggestion.decision)}</div>
    <div class="reason"><span class="muted">Why:</span> ${esc(suggestion.reason)}</div>${picture}
    <div class="buttons">${rejecting
      ? `<input id="reject-reason" placeholder="Tell the agent why (optional)"><button class="btn" id="back">Back</button><button class="btn primary" id="decline">Decline</button>`
      : `<button class="btn" id="reject-start">Decline…</button><button class="btn primary" id="approve-suggestion">Approve</button>`}</div></div>`;
}

function rowsHtml() {
  const out = [];
  for (const row of state.rows) {
    if (row.kind === "action") { if (halves.actions) out.push(actionHtml(row, halves.conversation)); }
    else if (halves.conversation) out.push(messageHtml(row));
  }
  out.push(requestHtml(state.agent && state.agent.request));
  out.push(suggestionHtml(state.agent && state.agent.suggestion));
  if (!out.join("").trim()) {
    return `<div class="empty">No messages yet. What you write here waits for the agent: it reads it on its next turn, or when one connects.</div>`;
  }
  return out.join("");
}

function render() {
  const old = $app.querySelector(".rows");
  const scrolled = old ? old.scrollTop : 0;
  const focused = document.activeElement && document.activeElement.id;
  const reason = $app.querySelector("#reject-reason");
  const rejectDraft = reason ? reason.value : "";
  $app.innerHTML = `<div class="page">${headerHtml()}
    <div class="rows">${rowsHtml()}</div>${connectHtml()}
    <div class="composer"><textarea id="msg" rows="1" maxlength="${LIMIT}" placeholder="Message the agent"></textarea>
      <div class="foot">${whoHtml()}<span id="foot">Enter sends · Shift+Enter for a new line</span>
      <button class="btn primary" id="send">Send</button></div></div></div>`;
  const msg = $app.querySelector("#msg");
  msg.value = draft;
  grow(msg);
  const newReason = $app.querySelector("#reject-reason");
  if (newReason) newReason.value = rejectDraft;
  if (focused === "msg") msg.focus();
  else if (focused === "reject-reason" && newReason) newReason.focus();
  for (const el of $app.querySelectorAll("[data-evidence]")) drawEvidence(el);
  for (const el of $app.querySelectorAll("[data-open-evidence]")) el.onclick = () => openEvidence(el.dataset.openEvidence);
  for (const el of $app.querySelectorAll("[data-picture]")) drawPicture(el);
  const list = $app.querySelector(".rows");
  list.scrollTop = pinned ? list.scrollHeight : scrolled;
  // Only the reader scrolling up unpins: a picture growing the rows below
  // (scrollTop unchanged) leaves the newest in view once it loads.
  let last = list.scrollTop;
  list.onscroll = () => {
    if (list.scrollHeight - list.scrollTop - list.clientHeight < 40) pinned = true;
    else if (list.scrollTop < last) pinned = false;
    last = list.scrollTop;
  };
  wire();
}

function grow(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight + 2, 150) + "px";
}

function say(text, error) {
  const foot = $app.querySelector("#foot");
  if (!foot) return;
  foot.textContent = text;
  foot.className = error ? "error" : "";
}

function wire() {
  const msg = $app.querySelector("#msg");
  msg.oninput = () => { draft = msg.value; grow(msg); };
  msg.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };
  $app.querySelector("#send").onclick = send;
  $app.querySelector("#panels-menu").onclick = () => openPanel(panel ? null : "experiment");
  $app.querySelector("#level").onclick = () => { levelOpen = !levelOpen; render(); };
  for (const el of $app.querySelectorAll("[data-level]")) {
    el.onclick = () => {
      levelOpen = false;
      act(api("/app/agent/level", { method: "PUT", body: JSON.stringify({ level: el.dataset.level }) }));
    };
  }
  for (const el of $app.querySelectorAll("[data-log]")) el.onclick = () => window.open(logUrl(), "_blank", "noopener");
  $app.querySelector("#stop").onclick = () => act(api("/app/agent/stop", { method: "POST" }));
  for (const el of $app.querySelectorAll("[data-half]")) {
    el.onclick = () => {
      const key = el.dataset.half, other = key === "actions" ? "conversation" : "actions";
      // The last half shown stays, as on the card.
      if (halves[key] && !halves[other]) return;
      halves[key] = !halves[key];
      render();
    };
  }
  const click = (sel, fn) => { const el = $app.querySelector(sel); if (el) el.onclick = fn; };
  click("#connect", openConnect);
  click("#connect-close", () => { connecting = false; render(); });
  click("#copy-setup", copySetup);
  click("#details", () => { detailsOpen = !detailsOpen; render(); });
  const suggestion = $app.querySelector("[data-suggestion]");
  if (suggestion) {
    const id = encodeURIComponent(suggestion.dataset.suggestion);
    click("#approve-suggestion", () => act(api(`/app/agent/suggestions/${id}/approve`, { method: "POST" })));
    click("#reject-start", () => { rejecting = true; render(); $app.querySelector("#reject-reason").focus(); });
    click("#back", () => { rejecting = false; render(); });
    click("#decline", () => {
      rejecting = false;
      act(api(`/app/agent/suggestions/${id}/decline`, {
        method: "POST", body: JSON.stringify({ reason: $app.querySelector("#reject-reason").value }),
      }));
    });
  }
  const request = $app.querySelector("[data-request]");
  if (request) {
    const id = encodeURIComponent(request.dataset.request);
    const on = (sel, fn) => { const el = $app.querySelector(sel); if (el) el.onclick = fn; };
    on("#approve", () => act(api(`/app/agent/requests/${id}/approve`, { method: "POST" })));
    on("#reject-start", () => { rejecting = true; render(); $app.querySelector("#reject-reason").focus(); });
    on("#back", () => { rejecting = false; render(); });
    on("#reject", () => {
      rejecting = false;
      act(api(`/app/agent/requests/${id}/reject`, {
        method: "POST", body: JSON.stringify({ reason: $app.querySelector("#reject-reason").value }),
      }));
    });
  }
}

async function openConnect() {
  connecting = true;
  render();
  try { connectAnswer = await api("/app/agent/connect"); }
  catch (e) { connecting = false; say(e.message, true); }
  render();
}

async function copySetup() {
  const text = connectAnswer && connectAnswer.text;
  try { await navigator.clipboard.writeText(text); say("Copied · paste it into your agent"); }
  catch (e) {
    // No clipboard (not localhost): select it to copy by hand.
    const range = document.createRange();
    range.selectNodeContents($app.querySelector("#setup"));
    getSelection().removeAllRanges(); getSelection().addRange(range);
    say("Selected · copy it with Ctrl+C");
  }
}

async function act(promise) {
  try { await promise; } catch (e) { say(e.message, true); }
  await refresh();
}

async function send() {
  const text = draft.trim();
  if (!text) return;
  try {
    await api("/app/agent/messages", { method: "POST", body: JSON.stringify({ text }) });
    draft = "";
    pinned = true;
    await refresh();
    const connected = state.agent && state.agent.last_heard_s != null && state.agent.last_heard_s < 120;
    say(connected ? "Sent · the agent reads it on its next turn" : "Sent · waiting for an agent");
  } catch (e) { say(e.message, true); }
}

// Read once: the promise until it lands, then the answer itself, so a redraw
// fills its rows at once and they keep their height (the reader's place too).
function once(cache, key, read, draw) {
  const known = cache.get(key);
  if (known === undefined) {
    const pending = read().catch(() => null).then(answer => { cache.set(key, answer); return answer; });
    cache.set(key, pending);
    pending.then(draw);
  } else if (known instanceof Promise) known.then(draw);
  else draw(known);
}

function drawEvidence(el) {
  const id = el.dataset.evidence;
  once(evidenceCache, id, () => api(`/app/agent/evidence/${encodeURIComponent(id)}`), answer => fillEvidence(el, answer));
}

function fillEvidence(el, answer) {
  const frame = el.querySelector(".frame");
  if (!answer || !answer.preview || !frame) { el.remove(); return; }
  const p = answer.preview;
  const w = p.full_width || p.width, h = p.full_height || p.height;
  const marks = answer.marks || {};
  // Sized for the picture shown a few hundred pixels wide, with a dark halo
  // so the marks read on a grey overview (FIB-1503).
  const label = (x, y, text) => text
    ? `<text x="${x}" y="${y}" fill="#ffd34d" font-weight="bold" font-size="${Math.max(w / 18, 12)}" stroke="#000" stroke-opacity=".8" stroke-width="${w / 120}" stroke-linejoin="round" paint-order="stroke">${esc(text)}</text>` : "";
  const r = Math.max(w / 50, 5), sw = Math.max(w / 150, 2);
  const haloed = shape => `${shape(`stroke="#000" stroke-opacity=".8" stroke-width="${sw * 2.2}"`)}${shape(`stroke="#ffd34d" stroke-width="${sw}"`)}`;
  const shapes = [
    ...(marks.points || []).map(m => `${haloed(s => `<circle cx="${m.x}" cy="${m.y}" r="${r}" fill="none" ${s}/>`)}${label(m.x + r * 1.4, m.y, m.label)}`),
    ...(marks.areas || []).map(m => `${haloed(s => `<rect x="${m.x}" y="${m.y}" width="${m.width}" height="${m.height}" fill="none" ${s}/>`)}${label(m.x, m.y - sw * 2, m.label)}`),
  ].join("");
  frame.innerHTML = `<img alt="Agent's evidence" src="data:image/jpeg;base64,${p.image_b64_jpeg}">
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${shapes}</svg>`;
  if (answer.path) {
    frame.insertAdjacentHTML("beforeend", `<button class="infiles" title="Show it in Files">In files</button>`);
    frame.querySelector(".infiles").onclick = e => { e.stopPropagation(); showInFiles(answer.path); };
  }
  el.onclick = () => el.classList.toggle("big");
  // The picture lands after the rows are drawn: keep the newest in view.
  frame.querySelector("img").onload = () => {
    const list = $app.querySelector(".rows");
    if (pinned && list) list.scrollTop = list.scrollHeight;
  };
}

// An action row's evidence, large over the page; a click closes it.
function openEvidence(id) {
  const el = document.createElement("div");
  el.className = "evidence big";
  el.dataset.evidence = id;
  el.innerHTML = `<div class="frame"></div>`;
  document.body.appendChild(el);
  el.addEventListener("click", () => el.remove());
  drawEvidence(el);
}

function drawPicture(el) {
  const key = `${el.dataset.picture}:${el.dataset.version}`;
  once(pictureCache, key, () => api(`/app/agent/pictures/${encodeURIComponent(el.dataset.picture)}`), answer => fillPicture(el, answer));
}

function fillPicture(el, answer) {
  const frame = el.querySelector(".frame");
  if (!answer || !answer.image_b64_png || !frame) { el.remove(); return; }
  frame.innerHTML = `<img alt="What the agent asks for, on the image" src="data:image/png;base64,${answer.image_b64_png}">`;
  el.onclick = () => el.classList.toggle("big");
  frame.querySelector("img").onload = () => {
    const list = $app.querySelector(".rows");
    if (pinned && list) list.scrollTop = list.scrollHeight;
  };
}

/* --- The side panels: Experiment and Microscope, from the bar on the right - */
const ICONS = {
  experiment: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 6.5h6l2 2h10v10.5H3z"/><path d="M3 6.5V5h6l2 2"/></svg>`,
  microscope: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h4l-1 7h-2z"/><path d="M11 10v2"/><circle cx="11" cy="14" r="2"/><path d="M5 21h14"/><path d="M15 9a6 6 0 0 1 1 11"/><path d="M8 18h5"/></svg>`,
};
const PANELS = [["experiment", "Experiment: its folders and images"], ["microscope", "Microscope: what it is and what it shows"]];
let panel = null;

function drawRail() {
  document.getElementById("rail").innerHTML = PANELS.map(([name, tip]) =>
    `<button data-panel="${name}" class="${panel === name ? "on" : ""}" title="${tip}" aria-pressed="${panel === name}">${ICONS[name]}</button>`).join("");
  for (const el of document.querySelectorAll("#rail [data-panel]")) el.onclick = () => openPanel(el.dataset.panel);
}

// The panel named, or none; its own button again closes it.
async function openPanel(name) {
  panel = name === panel ? null : name;
  $files.classList.toggle("open", !!panel);
  drawRail();
  render();
  if (panel === "experiment") await openExperiment();
  else if (panel === "microscope") await readMicroscope(true);
}

function panelBar(title, detail) {
  const others = PANELS.filter(([n]) => n !== panel).map(([n]) =>
    `<button class="btn panel-switch" data-switch="${n}">${n[0].toUpperCase() + n.slice(1)}</button>`).join("");
  return `<div class="bar"><b>${esc(title)}</b><span class="muted">${esc(detail || "")}</span>
    <span class="switches">${others}</span><button class="x" id="panel-close" title="Close">×</button></div>`;
}

function wirePanelBar() {
  for (const el of $files.querySelectorAll("[data-switch]")) el.onclick = () => openPanel(el.dataset.switch);
}

/* Microscope: read only. What it is, the latest image of each beam, and the
   stage and beams now. */
const scope = { info: null, state: null, images: null, status: null, devices: null, services: null };

async function readMicroscope(first) {
  if (panel !== "microscope") return;
  const take = path => api(path).catch(() => null);
  if (first || !scope.info || scope.info.error) {
    // What it is and what it has: read once each time the panel opens.
    const [info, devices, services] = await Promise.all([
      api("/microscope").catch(e => ({ error: e.message })), take("/microscope/devices"), take("/microscope/services")]);
    Object.assign(scope, { info, devices, services });
  }
  const info = scope.info;
  const [state, images, status] = await Promise.all([
    info.error ? null : take("/microscope/state"), take("/app/experiment/images"), take("/app/workflow/status")]);
  const before = JSON.stringify([scope.info, scope.state, scope.status, imageStamp(scope.images)]);
  Object.assign(scope, { info, state, images, status });
  if (first || JSON.stringify([info, state, status, imageStamp(images)]) !== before) drawMicroscope();
}

const imageStamp = images => images ? ["sem", "fib"].map(k => images[k] && images[k].acquired_at) : null;

function drawMicroscope() {
  if (panel !== "microscope") return;
  const info = scope.info && !scope.info.error ? scope.info : null;
  const ms = scope.state && scope.state.microscope_state, st = scope.status || {};
  const um = v => v == null ? "–" : `${+(v * 1e6).toPrecision(4)} µm`;
  const deg = v => v == null ? "–" : `${+(v * 180 / Math.PI).toFixed(1)}°`;
  const current = v => v == null ? "–" : v < 1e-9 ? `${+(v * 1e12).toPrecision(3)} pA` : `${+(v * 1e9).toPrecision(3)} nA`;
  const kv = v => v == null ? "–" : `${+(v / 1e3).toPrecision(3)} kV`;
  const when = iso => iso ? new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "";
  const parts = [];
  if (info) {
    const fitted = Object.entries(info.fitted || {}).filter(([, on]) => on).map(([k]) => k);
    parts.push(`<h3>Connected to</h3><dl>
      <dt>Microscope</dt><dd>${esc([info.manufacturer, info.model].filter(Boolean).join(" "))}</dd>
      ${info.serial_number ? `<dt>Serial</dt><dd>${esc(info.serial_number)}</dd>` : ""}
      ${info.software_version ? `<dt>Software</dt><dd>${esc(info.software_version)}</dd>` : ""}
      ${fitted.length ? `<dt>Fitted</dt><dd>${esc(fitted.join(", "))}</dd>` : ""}</dl>`);
  }
  const wf = st.workflow || {};
  const doing = [];
  if (wf.running) doing.push(`Running${wf.current_task ? ": " + esc(wf.current_task) : ""}${wf.current_item ? " on " + esc(wf.current_item) : ""}`);
  const now = state.agent && state.agent.now;
  if (now) doing.push(`Agent: ${esc(now)}`);
  parts.push(`<h3>Now</h3><div>${doing.length ? doing.join("<br>") : `<span class="muted">Nothing is running.</span>`}</div>`);
  const shot = (key, word) => {
    const p = scope.images && scope.images[key];
    if (!p || !p.image_b64_jpeg) return `<figure><div class="none">No ${word.toLowerCase()} image yet</div><figcaption>${word}</figcaption></figure>`;
    return `<figure><img data-live="${key}" src="data:image/jpeg;base64,${p.image_b64_jpeg}" alt="${word}">
      <figcaption>${word} · ${um(p.hfw)}${p.acquired_at ? " · " + when(p.acquired_at) : ""}</figcaption></figure>`;
  };
  parts.push(`<h3>Latest images</h3><div class="live">${shot("sem", "Electron")}${shot("fib", "Ion")}</div>`);
  if (ms) {
    const sp = ms.stage_position || {};
    parts.push(`<h3>Stage</h3><table><tr><th>x</th><th>y</th><th>z</th><th>Rotation</th><th>Tilt</th></tr>
      <tr><td>${um(sp.x)}</td><td>${um(sp.y)}</td><td>${um(sp.z)}</td><td>${deg(sp.r)}</td><td>${deg(sp.t)}</td></tr></table>`);
    const row = (word, b) => b ? `<tr><td>${word}</td><td>${kv(b.voltage)}</td><td>${current(b.beam_current)}</td><td>${um(b.hfw)}</td><td>${b.working_distance == null ? "–" : `${+(b.working_distance * 1e3).toPrecision(3)} mm`}</td></tr>` : "";
    parts.push(`<h3>Beams</h3><table><tr><th></th><th>Voltage</th><th>Current</th><th>Field width</th><th>WD</th></tr>
      ${row("Electron", ms.electron_beam)}${row("Ion", ms.ion_beam)}</table>`);
  }
  const listed = (title, map) => {
    const rows = Object.values(map || {});
    return rows.length ? `<h3>${title}</h3><dl>${rows.map(d =>
      `<dt>${esc(d.name)}</dt><dd>${esc([d.class, d.driver].filter(Boolean).join(" · "))}</dd>`).join("")}</dl>` : "";
  };
  parts.push(listed("Devices", scope.devices), listed("Services", scope.services));
  if (scope.info && scope.info.error) parts.push(`<p class="muted" style="margin-top:12px">${esc(scope.info.error)}</p>`);
  const name = info ? [info.manufacturer, info.model].filter(Boolean).join(" ") : "";
  $files.innerHTML = `<div class="inner">${panelBar("Microscope", name)}<div class="scope">${parts.join("")}</div></div>`;
  $files.querySelector("#panel-close").onclick = () => openPanel(null);
  wirePanelBar();
  for (const img of $files.querySelectorAll("[data-live]")) {
    img.onclick = () => {
      const big = document.createElement("div");
      big.className = "big-shot";
      big.innerHTML = `<img src="${img.src}" alt="">`;
      big.onclick = () => big.remove();
      document.body.appendChild(big);
    };
  }
}

/* --- Experiment: its folders and images ---------------------------------- */
// Read through /app/experiment/files, as the agent reads them: one folder at a
// time, each image as a preview with its metadata.
const $files = document.getElementById("files");
const THUMB = 280, VIEW = 768, FULL = 3072;
const files = { dirs: {}, dir: null, picked: null, beam: "all", items: {} };
const previews = new Map();

async function listDir(dir) {
  files.dirs[dir] = (await api(`/app/experiment/files?dir=${encodeURIComponent(dir)}`)).entries;
  return files.dirs[dir];
}

// Each position's state, for its folder's dot.
async function readItems() {
  try {
    const answer = await api("/app/experiment");
    files.items = {};
    for (const i of answer.items || []) files.items[i.lamella_name] = i;
  } catch (e) { files.items = {}; }
}

// A folder and each folder under it that holds images: what its shelf shows.
async function listTree(dir) {
  const entries = await listDir(dir);
  await Promise.all(entries.filter(e => e.kind === "folder" && e.images).map(e => listTree(e.path)));
}

async function openExperiment() {
  try {
    await Promise.all([listDir(""), readItems()]);
    if (files.dir === null) {
      const first = files.dirs[""].find(e => e.kind === "folder");
      await pickDir(first ? first.path : "");
    } else drawFiles();
  } catch (e) { drawFiles(e.message); }
}

async function pickDir(dir) {
  files.dir = dir; files.picked = null;
  try { await listTree(dir); drawFiles(); } catch (e) { drawFiles(e.message); }
}

async function showInFiles(path) {
  const dir = path.includes("/") ? path.slice(0, path.lastIndexOf("/")) : "";
  if (panel !== "experiment") await openPanel("experiment");
  files.beam = "all";
  await pickDir(dir);
  files.picked = path;
  drawFiles();
}

// Newer files leave the old previews behind: keyed by when the file changed.
function preview(entry, width) {
  const key = `${entry.path}@${entry.modified}@${width}`;
  if (!previews.has(key)) {
    previews.set(key, api(`/app/experiment/files/${entry.path.split("/").map(encodeURIComponent).join("/")}?width=${width}`)
      .catch(e => { previews.delete(key); throw e; }));
  }
  return previews.get(key);
}

function folderState(name) {
  const item = files.items[name];
  if (!item) return null;
  if (item.is_failure) return ["failed", `Failed${item.last_completed_task ? " after " + item.last_completed_task : ""}`];
  if (item.is_completed) return ["done", "Finished"];
  if (item.last_completed_task) return ["going", `Done: ${item.last_completed_task}`];
  return ["new", "Not started"];
}

const isIon = name => /(^|[_-])ib([_.-]|$)|ion/i.test(name);
// The open folder's images and its sub-folders', a group per folder.
function groups(beam = files.beam) {
  const out = [];
  const walk = dir => {
    const entries = files.dirs[dir] || [];
    const shown = entries.filter(e => e.kind === "image" && (beam === "all" || (beam === "ib") === isIon(e.name)));
    if (shown.length) out.push({ dir, images: shown });
    for (const e of entries) if (e.kind === "folder" && e.images) walk(e.path);
  };
  walk(files.dir);
  return out;
}
const images = () => groups().flatMap(g => g.images);
const known = () => Object.fromEntries(Object.values(files.dirs).flat().map(e => [e.path, e]));

function treeHtml() {
  return (files.dirs[""] || []).filter(e => e.kind === "folder").map(e => {
    const st = folderState(e.name);
    const open = files.dir === e.path || (files.dir || "").startsWith(e.path + "/");
    return `<button data-dir="${esc(e.path)}" class="${open ? "sel" : ""}" title="${esc(st ? st[1] : e.name)}">
      <span class="st ${st ? st[0] : ""}"></span><span class="name">${esc(e.name)}</span><span class="n">${e.images ?? ""}</span></button>`;
  }).join("");
}

// Where the open folder is, each folder above it a way back up.
function crumbsHtml() {
  if (!files.dir) return "<b>Experiment</b>";
  const parts = files.dir.split("/");
  return parts.map((part, i) => i === parts.length - 1 ? `<b>${esc(part)}</b>`
    : `<button class="crumb" data-dir="${esc(parts.slice(0, i + 1).join("/"))}">${esc(part)}</button>`)
    .join(`<span class="muted">/</span>`);
}

function shelfHtml(error) {
  if (error) return `<div class="muted">${esc(error)}</div>`;
  const entries = files.dirs[files.dir] || [];
  const shown = images();
  if (files.picked) {
    const i = shown.findIndex(e => e.path === files.picked);
    return `<div class="head"><button class="btn" id="back-folder">← ${esc(files.dir || "Experiment")}</button>
      ${i >= 0 ? `<span class="muted">${i + 1} of ${shown.length}</span>` : ""}
      <span class="turn"><button class="btn" id="prev"${i <= 0 ? " disabled" : ""}>‹</button>
      <button class="btn" id="next"${i < 0 || i >= shown.length - 1 ? " disabled" : ""}>›</button></span></div>
      <div id="viewer"></div>`;
  }
  const st = folderState(files.dir);
  const all = groups("all").reduce((n, g) => n + g.images.length, 0);
  const folders = entries.filter(e => e.kind === "folder" && e.images);
  const pill = (key, word) => `<button data-beam="${key}" class="${files.beam === key ? "on" : ""}">${word}</button>`;
  const thumb = e => `<button class="thumb" data-pick="${esc(e.path)}" title="${esc(e.name)}">
      <img data-thumb="${esc(e.path)}" alt=""><div class="cap">${esc(e.name.replace(/\.(tiff?|png|jpe?g)$/i, ""))}</div></button>`;
  const below = dir => dir.slice((files.dir ? files.dir.length + 1 : 0));
  const grid = groups().map(g => `${g.dir !== files.dir ? `<button class="group" data-dir="${esc(g.dir)}">${esc(below(g.dir))}/</button>` : ""}
    <div class="thumbs">${g.images.map(thumb).join("")}</div>`).join("");
  return `<div class="head">${crumbsHtml()}<span class="muted">${st ? esc(st[1]) + " · " : ""}${all} image${all === 1 ? "" : "s"}</span></div>
    ${folders.length ? `<div class="pills">${folders.map(f => `<button data-dir="${esc(f.path)}">${esc(f.name)}/ <span class="muted">${f.images}</span></button>`).join("")}</div>` : ""}
    ${all ? `<div class="pills">${pill("all", "All")}${pill("eb", "Electron")}${pill("ib", "Ion")}</div>` : ""}
    ${shown.length ? grid : `<div class="muted">No images here.</div>`}`;
}

function drawFiles(error) {
  if (panel !== "experiment") return;
  const scroll = $files.querySelector(".shelf");
  const top = scroll ? scroll.scrollTop : 0;
  $files.innerHTML = `<div class="inner">${panelBar("Experiment", (state.agent || {}).experiment)}
    <div class="split"><div class="tree">${treeHtml()}</div><div class="shelf">${shelfHtml(error)}</div></div></div>`;
  $files.querySelector(".shelf").scrollTop = files.picked ? 0 : top;
  $files.querySelector("#panel-close").onclick = () => openPanel(null);
  wirePanelBar();
  for (const el of $files.querySelectorAll("[data-dir]")) el.onclick = () => pickDir(el.dataset.dir);
  for (const el of $files.querySelectorAll("[data-beam]")) el.onclick = () => { files.beam = el.dataset.beam; drawFiles(); };
  for (const el of $files.querySelectorAll("[data-pick]")) el.onclick = () => { files.picked = el.dataset.pick; drawFiles(); };
  // A folder can hold hundreds: each thumbnail is read once it scrolls into view.
  const byPath = known();
  const seen = new IntersectionObserver(found => {
    for (const { isIntersecting, target: img } of found) {
      if (!isIntersecting) continue;
      seen.unobserve(img);
      preview(byPath[img.dataset.thumb], THUMB)
        .then(a => { img.src = `data:image/jpeg;base64,${a.preview.image_b64_jpeg}`; })
        .catch(() => { img.alt = "Can't read"; });
    }
  }, { root: $files.querySelector(".shelf"), rootMargin: "200px" });
  for (const img of $files.querySelectorAll("[data-thumb]")) seen.observe(img);
  const back = $files.querySelector("#back-folder");
  if (back) back.onclick = () => { files.picked = null; drawFiles(); };
  const prev = $files.querySelector("#prev"), next = $files.querySelector("#next");
  if (prev) prev.onclick = () => step(-1);
  if (next) next.onclick = () => step(1);
  if (files.picked) drawViewer(files.picked);
}

function step(by) {
  const shown = images(), i = shown.findIndex(e => e.path === files.picked) + by;
  if (i >= 0 && i < shown.length) { files.picked = shown[i].path; drawFiles(); }
}

document.addEventListener("keydown", e => {
  if (panel !== "experiment" || /TEXTAREA|INPUT/.test(document.activeElement.tagName)) return;
  if (document.querySelector(".big-shot")) { if (e.key === "Escape") document.querySelector(".big-shot").remove(); return; }
  if (!files.picked) return;
  if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === "Escape") { files.picked = null; drawFiles(); }
});

async function drawViewer(path) {
  const el = $files.querySelector("#viewer");
  const entry = known()[path] || { path, modified: "" };
  let answer;
  try { answer = await preview(entry, VIEW); } catch (e) {
    if (el) el.innerHTML = `<div class="muted">${esc(e.message)}</div>`;
    return;
  }
  if (!el || files.picked !== path) return;
  const m = answer.summary || {}, beam = m.beam || {};
  const fixed = (v, scale, unit) => v == null ? "–" : `${+(v * scale).toPrecision(3)} ${unit}`;
  const beamWords = [m.beam_type ? m.beam_type[0] + m.beam_type.slice(1).toLowerCase() : null,
    beam.voltage != null ? fixed(beam.voltage, 1e-3, "kV") : null,
    beam.current != null ? (beam.current < 1e-9 ? fixed(beam.current, 1e12, "pA") : fixed(beam.current, 1e9, "nA")) : null]
    .filter(Boolean).join(" · ");
  const taken = m.acquired_at ? new Date(m.acquired_at).toLocaleString([], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : null;
  const rows = [["Beam", beamWords], ["Field width", m.hfw != null ? fixed(m.hfw, 1e6, "µm") : null],
    ["Pixel size", m.pixel_size != null ? fixed(m.pixel_size, 1e9, "nm") : null], ["Taken", taken],
    ["Size", m.shape ? `${m.shape[1]} × ${m.shape[0]}` : null]].filter(r => r[1]);
  el.innerHTML = `<div class="viewer"><div class="name">${esc(path)}</div>
    <img src="data:image/jpeg;base64,${answer.preview.image_b64_jpeg}" alt="${esc(path)}" title="Click to enlarge">
    <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    <div class="buttons"><button class="btn" id="ask-about">Ask the agent about this</button></div></div>`;
  el.querySelector("img").onclick = () => enlarge(entry, answer);
  el.querySelector("#ask-about").onclick = () => {
    draft = `${draft ? draft + "\n" : ""}About ${path}: `;
    render();
    const msg = $app.querySelector("#msg");
    msg.focus();
    msg.setSelectionRange(msg.value.length, msg.value.length);
  };
}

// The whole window, at full resolution once it has loaded.
function enlarge(entry, answer) {
  const big = document.createElement("div");
  big.className = "big-shot";
  big.innerHTML = `<img src="data:image/jpeg;base64,${answer.preview.image_b64_jpeg}" alt="">`;
  big.onclick = () => big.remove();
  document.body.appendChild(big);
  if ((answer.preview.full_width || 0) > answer.preview.width) {
    preview(entry, FULL).then(full => {
      const img = big.querySelector("img");
      if (img) img.src = `data:image/jpeg;base64,${full.preview.image_b64_jpeg}`;
    }).catch(() => {});
  }
}

// While Files is open, what changed on the record may be new images.
async function refreshFiles() {
  if (panel !== "experiment" || files.dir === null) return;
  const before = JSON.stringify([files.dirs, files.items]);
  try { await Promise.all([listDir(""), listTree(files.dir), readItems()]); } catch (e) { return; }
  if (JSON.stringify([files.dirs, files.items]) !== before) drawFiles();
}

async function refresh() {
  try {
    const [agent, recent] = await Promise.all([api("/app/agent"), api("/app/agent/recent")]);
    state.agent = agent;
    state.rows = recent.rows || [];
    render();
    refreshFiles();
    readMicroscope(false);
    // The window draws a new request's picture just after it is filed.
    const shown = agent.request ? `request:${agent.request.request_id}` : "";
    if (shown && shown !== pictureAwaited && !(agent.pictures || {}).request) {
      pictureAwaited = shown;
      setTimeout(refresh, 1500);
    }
  } catch (e) { if (TOKEN) say(e.message, true); }
}

async function follow() {
  // The event stream's long-poll is the clock: any news re-reads the rows.
  while (TOKEN) {
    try {
      const answer = await api(`/app/events?since=${since}&timeout=25`);
      const latest = answer.latest_seq || 0;
      if (latest !== since) { since = latest; await refresh(); }
    } catch (e) {
      if (!TOKEN) return;
      await new Promise(resolve => setTimeout(resolve, 3000));
    }
  }
}

async function start(token) {
  TOKEN = token;
  try { sessionStorage.setItem(KEY, token); } catch (e) { /* storage off */ }
  await refresh();
  if (!TOKEN) return;
  follow();
  // Last heard moves with no events: re-read the agent now and then.
  setInterval(() => { if (TOKEN && !document.hidden) refresh(); }, 10000);
}

drawRail();
(function boot() {
  const fragment = new URLSearchParams(location.hash.slice(1));
  let token = fragment.get("token");
  if (token) history.replaceState(null, "", location.pathname);
  if (!token) { try { token = sessionStorage.getItem(KEY); } catch (e) { /* storage off */ } }
  if (token) start(token); else gate();
})();
</script>
