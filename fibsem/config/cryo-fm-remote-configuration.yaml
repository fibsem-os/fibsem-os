# A standalone cryo-FM with no FIB/SEM: fibsemOS connects only the devices listed
# here, and the App Server, the web app and the agent use them like a microscope's
# devices. The FM is served from its own PC by a Device Server (pair once with
# `fibsem-cli pair-device <address>:<port> <code>`). An entry with a local driver
# (for example `driver: Demo`) is built on this PC instead.
version: 2                                                  # configuration schema version
info:
    name: cryo-fm-remote-configuration                      # a descriptive name for your configuration                     [SPECIFIED]
    instrument: devices                                     # only the devices below, no microscope (default: fibsem)       [SPECIFIED]
hardware:
    devices:
      - name: fm
        type: fm
        driver:                     remote                      # served from the FM's PC by a Device Server                    [SPECIFIED]
        address:                    127.0.0.1                   # through an SSH tunnel, else the FM PC's address               [USER]
        port:                       8765                        # the Device Server's port                                      [USER]
