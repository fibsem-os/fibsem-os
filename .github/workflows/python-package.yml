# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  # A release branch is cut from a release tag and the final is tagged from it, so
  # what lands there by cherry-pick is what ships: it runs the full matrix.
  #
  # main is not here: every change reaches it through a pull request that already ran.
  # What a merge run would uniquely catch -- two pull requests green alone and broken
  # together, and the versions the pull request subset skips -- the nightly run below
  # catches, a day later at most.
  push:
    branches: [ "release/**" ]
  # The full matrix on main once a day, and on demand (Actions tab, "Run workflow")
  # when a merge looks risky enough not to wait. Scheduled runs only ever run on the
  # default branch.
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
  # No `branches:` filter: it matches the *base* branch, so scoping it to main gave a
  # stacked PR -- one based on another feature branch -- no checks at all.
  # ready_for_review on top of the default types: a draft skips Windows (below), so
  # marking it ready is what runs Windows before merge.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A PR's runs share one group, and a new push to the PR cancels the run in progress:
# only its latest commit matters. Any other run is the record of one commit on main or a
# release branch, so its group is keyed on the commit, not the branch, and nothing
# cancels it: a branch-keyed group holds one running and one *pending* run, and each
# newly queued run cancels the pending one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux on every supported version, Windows on the ends of the range. The
        # microscopes all run Windows; the oldest and newest catch what the middle
        # would.
        #
        # A pull request runs a subset: Linux 3.10 and Windows 3.10, the floor on both
        # platforms. The account gets about 20 concurrent hosted jobs, so the full
        # matrix runs nightly on main and on every push to a release branch.
        #
        # A draft runs Linux only. Windows is the slowest leg (about 20 minutes) and
        # drafts are pushed many times; it runs once the pull request is ready.
        os: [ubuntu-latest]
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.10"]' || '["3.10", "3.11", "3.12", "3.13"]') }}
        include: ${{ fromJSON(github.event_name == 'pull_request' && (github.event.pull_request.draft && '[]' || '[{"os":"windows-latest","python-version":"3.10"}]') || '[{"os":"windows-latest","python-version":"3.10"}, {"os":"windows-latest","python-version":"3.13"}]') }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # UI deps (the [ui] extra) are intentionally not installed here: the
        # `ui-tests` job below runs every test that needs them, and Qt is dead weight
        # on a job that runs six times.
        python -m pip install ".[test]"
    - name: Install the plugin entry point fixture
      # A packaged plugin is the only way into two of the three extension
      # points, so the entry point contract needs a plugin installed the way a
      # user installs one. Without this step tests/test_plugin_entry_points.py
      # skips, and a refactor could break every third-party plugin with no test
      # failure. --no-deps because fibsem is already installed above.
      run: python -m pip install --no-deps tests/fixtures/plugin
    - name: Test with pytest
      env:
        # Turns the fixture-missing skip into a hard error. Without this, losing
        # the install step above would silently skip the entry point tests and
        # leave the build green -- the exact silent breakage they exist to catch.
        FIBSEM_REQUIRE_PLUGIN_FIXTURE: "1"
      # Tests marked `slow` (simulated alignment and FM acquisition, 15 to 120 s each)
      # run once on a pull request, in the slow-tests job below, beside this one
      # rather than inside it; the nightly and release runs keep them on every leg.
      run: pytest tests/ -n auto --dist worksteal --timeout=300 ${{ github.event_name == 'pull_request' && '-m "not slow"' || '' }}

  slow-tests:
    # A pull request's `slow` tests, on Linux 3.10 only. They exercise the simulator
    # rather than anything platform-specific. In their own job they run alongside the
    # rest of the suite instead of adding their ~7 minutes to the Linux leg.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.10"
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[test]"
    - name: Test with pytest
      run: pytest tests/ -m slow -n auto --dist worksteal --timeout=300

  ui-tests:
    # The one job that installs the [ui] extra, and the only place the Qt tests
    # are ever run: everything under tests/ui/, plus the files in tests/correlation/
    # and tests/fm/ that guard on PyQt5.
    #
    # Every file under tests/ui/ opens with `pytest.importorskip("PyQt5")`. The
    # matrix job above installs `.[test]` without it, so those files skip there and
    # its green says nothing about that directory; two pull requests each green alone
    # can break it together, and only a run with PyQt5 installed catches that.
    #
    # In tests/correlation/ and tests/fm/, only the files that name PyQt5 run here,
    # found at run time rather than listed, so a Qt test added there later is still
    # picked up. Their other tests run in the matrix. No other file there imports
    # fibsem.ui, qtpy, superqt or qtawesome.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        # One version, not the matrix. What this job answers -- does the UI code
        # import, and does it behave -- does not vary across Python versions, so
        # running it four times would repeat the same answer. 3.11 because it is
        # what everyone develops against.
        python-version: "3.11"
        cache: 'pip'
    - name: Install the libraries Qt's offscreen platform plugin links against
      # libqoffscreen.so needs libGL, libX11, libXext, libfontconfig, libfreetype
      # and libglib (read off the wheel's ELF DT_NEEDED entries). All but libGL are
      # already on the runner image. Note it does NOT need the xcb/xkbcommon stack
      # that the normal `xcb` platform pulls in -- that is the point of running
      # offscreen rather than under a virtual display.
      #
      # If one of the others ever goes missing the failure is loud and immediate:
      # Qt refuses to load the platform plugin, names the library, and every test
      # errors at QApplication construction. There is no version of this that
      # passes while broken.
      run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[test,ui]"
    - name: Fail if the UI extra did not actually install
      # A green job that skipped everything is the exact failure mode this job
      # exists to end. Because every file guards on importorskip, a broken install
      # does not turn the run red -- it empties it, and empty reads as passing.
      # So check the imports directly, where absence is an error.
      run: python -c "import PyQt5, qtawesome, superqt"
    - name: Test with pytest
      env:
        QT_QPA_PLATFORM: offscreen
      # Four fixed shards, each serial, not xdist. These tests share one QApplication
      # and leak top-level widgets across files, so some depend on what the files
      # before them left behind. xdist hands files to workers in a different order
      # on every run and would turn a deterministic failure into a flake. Here a
      # file's shard and its place in it are set by the sorted list alone, so a
      # failure reproduces with `pytest <that shard's files>`, which the log prints.
      run: |
        set -euo pipefail
        qt_files=$(grep -rlE --include='test_*.py' 'PyQt5' tests/correlation tests/fm | sort)
        # Echoed so an empty or shrunken list is visible rather than silently green.
        echo "Qt test files in tests/correlation and tests/fm: $(echo "$qt_files" | grep -c .)"
        files=$( (find tests/ui -name 'test_*.py'; echo "$qt_files") | grep . | sort)
        echo "Qt test files in all: $(echo "$files" | grep -c .)"
        shards=4
        logs=$(mktemp -d)
        pids=()
        for i in $(seq 0 $((shards - 1))); do
          shard=$(echo "$files" | awk -v n=$shards -v i=$i 'NR % n == i')
          echo "$shard" > "$logs/files-$i"
          pytest $shard -q --timeout=300 -p no:cacheprovider > "$logs/log-$i" 2>&1 &
          pids+=($!)
        done
        failed=0
        for i in $(seq 0 $((shards - 1))); do
          status=0
          wait "${pids[$i]}" || status=$?
          echo "::group::Shard $((i + 1)) of $shards (exit $status)"
          echo "Files:"; sed 's/^/  /' "$logs/files-$i"
          cat "$logs/log-$i"
          echo "::endgroup::"
          if [ "$status" -ne 0 ]; then
            failed=1
            echo "::error::Qt shard $((i + 1)) failed:"
            grep -E '^(FAILED|ERROR) ' "$logs/log-$i" || tail -40 "$logs/log-$i"
          fi
        done
        exit $failed

  agent-tests:
    # The one job that installs the [agent] extra (and [mcp] with it): the MCP
    # sidecar and the fibsem-agent harness. The files that need them open with
    # `pytest.importorskip("mcp")` or `("claude_agent_sdk")`, so they skip in the
    # matrix job above; they run here, found at run time rather than listed.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        # One version, not the matrix: what this job answers -- does the agent side
        # behave with its real dependencies -- does not vary across versions.
        python-version: "3.11"
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[test,agent]"
    - name: Fail if the extras did not actually install
      # Same rationale as the ui-tests guard: every test file skips on missing
      # imports, so a broken install empties the run instead of reddening it.
      run: python -c "import mcp, claude_agent_sdk"
    - name: Test with pytest
      run: |
        set -euo pipefail
        agent_files=$(grep -rlE --include='test_*.py' 'importorskip\("(mcp|claude_agent_sdk)"' tests | sort)
        # Echoed so an empty or shrunken list is visible rather than silently green.
        echo "Agent test files: $(echo "$agent_files" | grep -c .)"
        pytest $agent_files -q --timeout=300

  lint:
    # Its own job, not a step inside the matrix above: ruff's result does not
    # vary by OS or Python version, so running it in the matrix would repeat the
    # same answer six times. This takes about ten seconds.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        # The formatting step below diffs against the merge base, which does not
        # exist in the default shallow clone.
        fetch-depth: 0
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    # Pinned so a new ruff release cannot turn this red on a commit that changed
    # nothing. Keep in sync with the `dev` extra in pyproject.toml.
    - run: python -m pip install ruff==0.16.3
    # --output-format=github annotates the diff instead of only failing the job.
    - run: ruff check --output-format=github .
    - name: Check formatting of the files this PR changes
      # Format-on-touch rather than a whole-tree flag day: a file has to be
      # formatted once something in it is edited. `main` stays mixed for a while,
      # which is the accepted cost.
      #
      # The count is echoed on purpose. The failure mode of a diff-scoped check
      # is that the diff comes back empty -- wrong base, shallow clone -- and
      # the job passes green having checked nothing, so the number has to be
      # visible in the log to be disbelieved.
      run: |
        set -euo pipefail
        base=$(git merge-base origin/main HEAD)
        # mktemp, not a file in the repo root: this script is meant to be
        # runnable locally too, and it should not leave anything behind.
        changed=$(mktemp)
        trap 'rm -f "$changed"' EXIT
        git diff --name-only --diff-filter=d "$base" HEAD -- '*.py' > "$changed"
        count=$(wc -l < "$changed" | tr -d ' ')
        echo "python files changed against $base: $count"
        if [ "$count" -eq 0 ]; then
          echo "no python files changed; nothing to check"
          exit 0
        fi
        sed 's/^/  /' "$changed"
        # NUL-separated: a path with a space would otherwise split into two.
        # --force-exclude is required, not optional: ruff ignores `exclude` for
        # paths named explicitly on the command line, and this step names every
        # path explicitly.
        if ! tr '\n' '\0' < "$changed" \
             | xargs -0 ruff format --check --force-exclude --; then
          echo
          echo "To fix, from the repo root:"
          echo "  ruff format \$(git diff --name-only --diff-filter=d \$(git merge-base origin/main HEAD) HEAD -- '*.py')"
          exit 1
        fi

  web:
    # The web app's build output is committed so a wheel install serves /ui/
    # without Bun. This rebuilds it and fails when the commit and the source
    # disagree, including the palette written from fibsem/theme/tokens.py.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.4.2"
    - run: python scripts/web_theme.py
    - run: bun install --frozen-lockfile
      working-directory: web
    - run: bun run build
      working-directory: web
    - name: Fail if the committed build or theme is stale
      run: |
        git status --porcelain -- fibsem/server/ui web/src/theme.css
        test -z "$(git status --porcelain -- fibsem/server/ui web/src/theme.css)" || {
          echo "Run 'bun run theme && bun run build' in web/ and commit the result."
          exit 1
        }
