# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux on every supported version, Windows on the ends of the range.
        # The microscopes all run Windows, so every platform-specific claim in the
        # codebase was previously untested on the platform that matters (FIB-704) --
        # but twelve jobs is more wall-clock than the coverage is worth, and the
        # oldest and newest catch what the middle would.
        os: [ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.8"
          - os: windows-latest
            python-version: "3.13"

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # UI deps (the [ui] extra) are intentionally not installed: the
        # napari/PyQt5 tests importorskip and are skipped on CI.
        python -m pip install ".[test]"
    - name: Install the plugin entry point fixture
      # A packaged plugin is the only way into two of the three extension
      # points, so the entry point contract needs a plugin installed the way a
      # user installs one. Without this step tests/test_plugin_entry_points.py
      # skips, and a refactor could break every third-party plugin with no test
      # failure. --no-deps because fibsem is already installed above.
      run: python -m pip install --no-deps tests/fixtures/plugin
    - name: Test with pytest
      env:
        # Turns the fixture-missing skip into a hard error. Without this, losing
        # the install step above would silently skip the entry point tests and
        # leave the build green -- the exact silent breakage they exist to catch.
        FIBSEM_REQUIRE_PLUGIN_FIXTURE: "1"
      run: pytest tests/ -n auto --dist worksteal --timeout=300

  lint:
    # Its own job, not a step inside the matrix above: ruff's result does not
    # vary by OS or Python version, so running it in the matrix would repeat the
    # same answer eight times. This takes about ten seconds.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    # Pinned so a new ruff release cannot turn this red on a commit that changed
    # nothing. Keep in sync with the `dev` extra in pyproject.toml.
    - run: python -m pip install ruff==0.16.3
    # --output-format=github annotates the diff instead of only failing the job.
    - run: ruff check --output-format=github .
