name: Dependency audit

# pyproject.toml gives floors, so an install today resolves to versions no
# release was tested with. Once a week this installs what a user installs and
# checks it against the known-vulnerability databases. A finding opens an
# issue, or comments on the one already open.
on:
  schedule:
    - cron: "0 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install what a user installs
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[ui,agent]" pip-audit
      - name: Audit
        id: audit
        run: |
          set +e
          python -m pip_audit --progress-spinner off --desc on \
            --format markdown > audit.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat audit.md
      - name: Open or update the issue
        if: steps.audit.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Dependency audit: known vulnerabilities"
          {
            echo "pip-audit failed on what \`pip install \"fibsem[ui,agent]\"\` resolves to today."
            echo
            cat audit.md
            echo
            echo "Run: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
          } > body.md
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
