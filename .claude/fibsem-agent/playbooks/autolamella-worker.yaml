# On-grid AutoLamella with the general worker: the lead hands each Setup
# placement and each lamella's polishing to `fibsem-worker`, one site or
# lamella at a time, instead of doing them in its own context. Opt-in until
# the worker has its evals; `autolamella` is the default.
extends: autolamella
description: On-grid lamellae, Setup and Polishing handed to a worker per site or lamella.
agents: [fibsem-worker]
rules:
  - Hand each Setup placement and each lamella's polishing to fibsem-worker, one at a time, briefed as fibsem-agent's Briefing a worker says.
opt_in: true
