# Segmenting an episode (the record of one run) into the decisions an eval
# case could score. Offline: no instrument, run on an agent host, with the
# episode folder as its files folder. `python -m fibsem.ai.evals episode
# segment` starts it, with its budget on the command line; it reads the
# episode and writes segments.yaml. The base's session settings hold.
description: Segment a recorded run into the decisions an eval case could score.
instrument: none
mcp: []
skills: [eval-segmenter]
rules:
  - Write segments.yaml in the episode folder and no other file.
  - Every segment you write has status proposed; a person keeps or drops them.
