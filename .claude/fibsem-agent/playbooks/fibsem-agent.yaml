# The base playbook: a session starts on it when its launch names none, and
# the shipped playbooks extend it. A lab's own copy in
# ~/.fibsem/knowledge/playbooks/ wins by name, but this file stays under it:
# it is the one place the agent's defaults live, and the code keeps no copy.
# `fibsem-agent --show-config` prints what a session runs with; flags on the
# command line win.
description: General microscope work, for when no workflow fits.
# The instrument kind: its prompt files are in ../instruments/<kind>/.
instrument: fibsem
# The MCP servers the agent uses, by name: fibsem is the sidecar to the App
# Server, built in; any other is an entry in the lab's ~/.fibsem/agent/mcp.yaml.
# A playbook adds its own; a server in the lab's mcp.yaml is on only for a
# playbook that names it.
mcp: [fibsem]
# The fibsem tools loaded from the first turn: the CLI defers the rest until
# the agent finds them with ToolSearch. The ones every session uses; each
# costs context from the start, so a playbook adds only its own few.
tools:
  - server_get_capabilities
  - app_get_status
  - proposal_list
  - plan_get
  - plan_set_section
  - experiment_message_operator
  - experiment_add_note
  - workflow_get_queue
  - knowledge_list
  - stage_get_position
  - microscope_get_state
  - beam_acquire_image
  - analysis_crop_image
  - analysis_draw_image
session:
  effort: high
  max_budget_usd: 500
  max_turns: 40
  mode: files
  # The longest wake-up the agent can set itself, in minutes.
  wake_max_min: 240
  # A deadline in the plan wakes the agent this many minutes before it.
  deadline_warn_min: 30
  # A running workflow this many minutes without an event wakes the agent once.
  quiet_min: 20
  # The agent is told once, in its next wake-up, when its context first passes
  # each of these sizes (tokens): each turn re-reads all of it, so it may
  # choose a fresh context (context_reset) at a good stopping point.
  context_marks: [300000, 500000, 700000]
  # The CLI compacts the context near the model's window unless this sets
  # its auto-compact window (tokens, 100000 to 1000000). Unset by default.
  # compact_window: 600000
# Read first, every session.
skills: [fibsem-agent, fibsem-microscope]
reminders:
  hardware_error: Stop. Don't retry. Message the operator with the error word for word.
# Read every turn, so only the rules that must hold on every task; the work
# itself is in the skills.
rules:
  - "Never trust an auto function's result on its own (alignment, focus, thickness, centre offsets): look at the image it gives and check it worked well enough before you act on it."
  - Judge an image only once its focus and brightness/contrast are good enough; fix them first.
  - "Every time you choose a position (a site, a lamella, a place to mill), verify focus, brightness/contrast and SEM/FIB coincidence there before you accept it, even for FIB-only milling. Coincident means the same feature is centred in both the SEM and the FIB image at a 50 µm field of view: within 5 µm of centre in both, aiming for 2-3 µm."
