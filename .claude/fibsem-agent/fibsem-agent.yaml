# The profile fibsem-agent runs with when none is named, and the one the
# gateway and the hub offer first. `fibsem-agent --show-config` prints what it
# runs with, and `fibsem-agent --list-hooks` lists when a reminder can fire.
# Flags on the command line win.
effort: high
max_budget_usd: 500
max_turns: 40
mode: files
hooks:
  - when: hardware_error
    say: Stop. Don't retry. Message the operator with the error word for word.
  - when: after_polish_pass
    say: >-
      Look at the pass figure and its facts before the next pass: the band,
      both faces, the target against the control, and the SEM. Stop and ask on
      any of autolamella-agent's Iterative Polishing stop points.
